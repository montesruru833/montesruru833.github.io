
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formunario">
    <meta name="author" content="Sergio">
    <meta name="keywords" content="html, pagina, formulario, nombre">

    <link rel="icon" type="image/jpg" href="/montesruru833.github.io/Restaurante/imagenes/logo_sergio.jpg">
    <br>
    
    <title>Formulario</title>
    
  </head>
  <body>
    
    <header>
    <h1>CUESTIONARIO AMIGOS DE LA INFORMÁTICA.</h1>
    </header>
  
    <nav>

    </nav>
    
    <main>
      
      <section>
        
        <article>
          <form>
            <!-- Título principal -->
            <p style="text-align: center;"><strong>Rellena el siguiente cuestionario para formar parte del club de "Amigos de la informática"</strong></p>
            
            <!-- Bloque 1: Datos personales -->
            <fieldset>
              <legend>Datos personales</legend>
              
              <label for="nombre">Nombre:</label>
              <input type="text" id="nombre" name="nombre"><br><br>
              
              <label for="domicilio">Domicilio:</label>
              <input type="text" id="domicilio" name="domicilio" placeholder="<calle, numero y localidad>"><br><br>
              
              <label for="pais">País de origen:</label>
              <select id="pais" name="pais">
                <option value="espana" selected>España</option>
                <option value="otro">Otro</option>
              </select><br><br>
              
              <label for="fecha_nac">Fecha de nacimiento:</label>
              <input type="date"><br><br>
              
              <label for="correo">Correo electrónico:</label>
              <input type="text" id="correo" name="correo"><br><br>
              
              <label for="telefono">Teléfono:</label>
              <input type="text" id="telefono" name="telefono"><br><br>
              
              <label>Estado civil:</label>
              <input type="radio" id="soltero" name="estado_civil" value="soltero">
              <label for="soltero">Solter@</label>
              
    <input type="radio" id="casado" name="estado_civil" value="casado">
    <label for="casado">Casad@</label>
    
    <input type="radio" id="separado" name="estado_civil" value="separado">
    <label for="separado">Separad@</label>
    
    <input type="radio" id="viudo" name="estado_civil" value="viudo">
    <label for="viudo">Viud@</label><br><br>
    
    <label>Sexo:</label>
    <input type="radio" id="hombre" name="sexo" value="hombre">
    <label for="hombre">Hombre</label>
    
    <input type="radio" id="mujer" name="sexo" value="mujer">
    <label for="mujer">Mujer</label>
  </fieldset>
  
  <br>
  
  <!-- Bloque 2: Otra información de interés -->
  <fieldset>
    <legend>Otra información de interés</legend>
    
    <label for="componentes">Seleccione los componentes electrónicos con los que habitualmente trabajas:</label>
    <select id="componentes" name="componentes" multiple size="4">
      <option value="movil">Móvil</option>
      <option value="tablet">Tablet</option>
      <option value="ordenador">Ordenador</option>
      <option value="ebook">Ebook</option>
    </select><br><br>
    
    <label>Seleccione tus actividades favoritas:</label><br>
    <input type="checkbox" id="deporte" name="actividad" value="deporte">
    <label for="deporte">Hacer deporte</label>
    
    <input type="checkbox" id="amigos" name="actividad" value="amigos">
    <label for="amigos">Salir con mis amigos</label>
    
    <input type="checkbox" id="series" name="actividad" value="series">
    <label for="series">Ver series, pelis,...</label><br>
    
    <input type="checkbox" id="senderismo" name="actividad" value="senderismo">
    <label for="senderismo">Realizar rutas de senderiso</label>
    
    <input type="checkbox" id="cine" name="actividad" value="cine">
    <label for="cine">Ir al cine</label>
    
    <input type="checkbox" id="musica" name="actividad" value="musica">
    <label for="musica">Escuchar música</label><br><br>
    
    <label for="motivo">Explique brevemente el motivo por el que desea ingresar en nuestro club:</label><br>
    <textarea id="motivo" name="motivo" rows="4" cols="50"></textarea><br><br>
    
    <label for="peli">Elige o escribe tu peli favorita:</label>
    <input type="text" id="peli" name="peli">
  </fieldset>
  
  <br>
  
  <!-- Botones de envío -->
  <div style="text-align: center;">
    <button type="submit">Enviar</button>
    <button type="reset">Cancelar</button>
  </div>
</form>



</article>

</section>

</aside>

</main>

</html>
