<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Formulario del restaurante">
    <meta name="author" content="Sergio">
    <meta name="keywords" content="html, pagina, horario, asignatura, descanso">

    <link rel="icon" type="image/jpg" href="imagenes/logo.jpg">

<body>

<header>
    <h1>Formulario del restaurante.</h1>
</header>

<nav>
 
</nav>

<main>

    <title>Pagina web de Sergio.</title>

<main>

    <section>

        <article>

          <form>
  <!-- Sección 1: Datos Personales -->
  <fieldset style="border: 1px solid #000; background: none; padding: 15px; margin-bottom: 15px;">
    <legend style="padding: 0 5px;">Datos Personales</legend>
    
    <label for="nombre">Nombre:</label><br>
    <input type="text" id="nombre" name="nombre"> <br>
    
    <label for="apellidos">Apellidos:</label><br>
    <input type="text" id="apellidos" name="apellidos"> <br>
    
    <label for="dni">DNI</label><br>
    <input type="text" id="dni" name="dni"><br><br>

    <label for="loc_nacimiento">Localidad de Nacimiento</label><br>
    <input type="text" id="loc_nacimiento" name="loc_nacimiento"> <br>
    
    <label for="provincia">Provincia:</label><br>
    <select id="provincia" name="provincia"><br>
      <option value="huelva">Huelva</option><br>
      <option value="cordoba">Cordoba</option><br>
      <option value="sevilla">Sevilla</option><br>
      <option value="granada">Granada</option><br>
      <option value="jaen">Jaen</option><br>
      <option value="malaga">Malaga</option><br>
      <option value="cadiz">Cadiz</option><br>
      <option value="almeria">Almeria</option><br>
    </select><br>
    
    <label for="fecha_nacimiento">Fecha de Nacimiento</label><br>
    <input type="date"><br>

    <label for="direccion">Dirección</label><br>
    <input type="text" id="direccion" name="direccion"> <br>
    
    <label for="codigo_postal">Código Postal:</label><br>
    <input type="text" id="codigo_postal" name="codigo_postal"><br>
  </fieldset>

  <!-- Sección 2: Forma de Acceso -->
  <fieldset style="border: 1px solid #000; background: none; padding: 15px; margin-bottom: 15px;">
    <legend style="padding: 0 5px;">Forma de Acceso</legend>
    
    <input type="radio" id="directo" name="forma_acceso" value="directo">
    <label for="directo">Directo</label><br>
    
    <input type="radio" id="bachillerato" name="acceso_directo" value="bachillerato">
    <label for="bachillerato">Bachillerato Log Modalidad</label>
    <input type="text" name="bachillerato_spec"><br>
    
    <input type="radio" id="experimental" name="acceso_directo" value="experimental">
    <label for="experimental">Experimental</label>
    <input type="text" name="experimental_spec"><br>
    
    <input type="radio" id="cou" name="acceso_directo" value="cou">
    <label for="cou">COU Opción</label>
    <input type="text" name="cou_spec"><br>
    
    <input type="radio" id="fp2" name="acceso_directo" value="fp2">
    <label for="fp2">FP2</label><br>
    
    <input type="radio" id="otros_acceso" name="acceso_directo" value="otros">
    <label for="otros_acceso">Otros (especifique)</label>
    <input type="text" name="otros_acceso_spec"><br>
    
    <input type="radio" id="prueba_libre" name="forma_acceso" value="prueba_libre">
    <label for="prueba_libre">Prueba Libre</label><br>
  </fieldset>

  <!-- Sección 3: Documentos Adjuntos -->
  <fieldset style="border: 1px solid #000; background: none; padding: 15px; margin-bottom: 15px;">
    <legend style="padding: 0 5px;">Documentos Adjuntos</legend>
    
    <input type="checkbox" id="fotocopia_dni" name="doc_dni">
    <label for="fotocopia_dni">Fotocopia DNI</label> <br>
    
    <label for="certificado_academico">Certificado Académico</label>
    <input type="checkbox" id="certificado_academico" name="doc_certificado"><br><br>
    
    <input type="checkbox" id="otros_docs" name="doc_otros">
    <label for="otros_docs">Otros documentos (especifique)</label><br>
    <input type="text" name="otros_docs_spec">
  </fieldset>

  <!-- Botones finales -->
  <div style="text-align: center; margin-top: 20px;">
    <button type="submit">Enviar Solicitud</button>
    <button type="reset">Limpiar datos</button>
  </div>
</form>

    
        </article>

    </section>

    <aside>
    
    </aside>

</main>
