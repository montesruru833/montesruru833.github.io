  <!-- Encabezado y botón de cierre -->
  <div style="display: flex; justify-content: space-between; align-items: center;">
    <h2>Haz una reserva</h2>
    <span style="cursor: pointer; font-size: 20px;"></span>
  </div>

  <br>

  <!-- Fila 1 -->
  <div>
    <input type="text" id="nombre" name="nombre" placeholder="Su nombre">

  </div>
  
  <br>

  <!-- Fila 2 -->
  <div>
    <input type="email" id="email" name="email" placeholder="Su correo electrónico">

  </div>
  
  <br>

  <!-- Fila 3 -->
  <div>
    <input type="date" id="fecha" name="fecha">
    
    <input type="time" id="hora" name="hora">
  </div>
  
  <br>

  <!-- Fila 4: Mensaje -->
  <div>
    <input type="text" id="mensaje" name="mensaje" placeholder="Su mensaje" style="width: 100%; padding: 10px;">
  </div>
  
  <br><br>

  <!-- Botón de envío -->
  <div style="text-align: center;">
    <button type="submit">SOLICITAR RESERVA</button>
  </div>

  <br>

  <!-- Texto de política de privacidad -->
  <p style="text-align: center; font-size: 12px;">
